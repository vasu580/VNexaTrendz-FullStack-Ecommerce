spring.application.name=nxt-trendz-backend

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/nxt_trendz?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=NxtTrendzSuperSecretKeyForJWTTokenSigningMustBe256BitsLong123456
jwt.expiration=86400000

# Server
server.port=8088

# CORS
spring.web.cors.allowed-origins=http://localhost:5173
